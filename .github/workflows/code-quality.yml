name: Code quality

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install Ruff
        run: |
          uv tool install ruff

      - name: Lint with Ruff
        run: |
          ruff check --output-format=github

      - name: Format check with Ruff
        run: |
          ruff format --diff --output-format=github

      - name: Type check with ty
        run: |
          uv sync
          uvx ty check
